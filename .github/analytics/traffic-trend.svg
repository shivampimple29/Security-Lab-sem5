        .title-text { fill: #8b949e; }
        .legend-text { fill: #8b949e; }
        .axis-label { fill: #6e7681; }
        .count-label { fill: #f0f6fc; }
        .empty-text { fill: #6e7681; }
        .baseline { stroke: #21262d; }
      }
